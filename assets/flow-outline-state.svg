<svg xmlns="http://www.w3.org/2000/svg" width="720" height="300" viewBox="0 0 720 300">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/>
    </marker>
  </defs>
  <rect width="720" height="300" fill="#ffffff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">

    <text x="24" y="28" font-size="14" font-weight="700" fill="#1e293b">大纲确认状态机</text>
    <line x1="24" y1="36" x2="148" y2="36" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- ===== NODES ===== -->

    <!-- Start marker (filled circle) -->
    <circle cx="20" cy="150" r="8" fill="#0e1115"/>

    <!-- S0 大纲生成: rect[50,128,130,44] center(115,150) -->
    <rect x="50" y="128" width="130" height="44" rx="14" fill="#e5e9ff" stroke="#0065fd" stroke-width="2"/>
    <text x="115" y="150" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="#0e1115">大纲生成</text>

    <!-- D1 等待确认 (diamond) center(320,150) L(250,150) R(390,150) T(320,90) B(320,210) -->
    <polygon points="250,150 320,90 390,150 320,210" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="320" y="144" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#0e1115">等待</text>
    <text x="320" y="162" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#0e1115">确认</text>

    <!-- S1 整体重写: rect[470,68,120,44] center(530,90) -->
    <rect x="470" y="68" width="120" height="44" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="530" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#0e1115">整体重写</text>

    <!-- S2 进入讲解: rect[470,128,120,44] center(530,150) -->
    <rect x="470" y="128" width="120" height="44" rx="14" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="530" y="150" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#0e1115">进入讲解</text>

    <!-- S3 局部调整: rect[470,188,120,44] center(530,210) -->
    <rect x="470" y="188" width="120" height="44" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <text x="530" y="210" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#0e1115">局部调整</text>

    <!-- End marker (bullseye) center(660,150) -->
    <circle cx="660" cy="150" r="12" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    <circle cx="660" cy="150" r="6" fill="#22c55e"/>

    <!-- ===== MAIN FLOW (solid, with arrows) ===== -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <!-- Start → S0 -->
      <line x1="28" y1="150" x2="50" y2="150"/>
      <!-- S0 → D1 (水平主线，中心对齐) -->
      <line x1="180" y1="150" x2="250" y2="150"/>
      <!-- D1 top → S1 (整体不满意) -->
      <line x1="320" y1="90" x2="470" y2="90"/>
      <!-- D1 right → S2 (明确确认) -->
      <line x1="390" y1="150" x2="470" y2="150"/>
      <!-- D1 bottom → S3 (个别调整) -->
      <line x1="320" y1="210" x2="470" y2="210"/>
      <!-- S2 → End -->
      <line x1="590" y1="150" x2="648" y2="150"/>
    </g>

    <!-- ===== LOOP PATHS (dashed, with arrows) ===== -->
    <!-- S1→S0 重新生成: S1 top(530,68) → up to y=44 → left to x=115 → down to S0 top(115,128) -->
    <!-- S3→D1 调整后回到确认: S3 bottom(530,232) → down to y=268 → left to x=320 → up to D1 bottom(320,210) -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-dasharray="6 3" marker-end="url(#arr)">
      <path d="M530,68 L530,44 L115,44 L115,128"/>
      <path d="M530,232 L530,268 L320,268 L320,210"/>
    </g>

    <!-- ===== LABELS ===== -->
    <g font-size="11" fill="#7f8d9f">
      <!-- branch labels on their horizontal segments -->
      <text x="395" y="82" text-anchor="middle">整体不满意</text>
      <text x="430" y="142" text-anchor="middle">明确确认</text>
      <text x="395" y="224" text-anchor="middle">个别调整</text>
      <!-- loop labels on the outer horizontals -->
      <text x="322" y="38" text-anchor="middle">重新生成</text>
      <text x="425" y="282" text-anchor="middle">调整后回到确认</text>
    </g>

  </g>
</svg>
