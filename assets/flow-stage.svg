<svg xmlns="http://www.w3.org/2000/svg" width="960" height="890" viewBox="0 0 960 890">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#f59e0b"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="960" height="890" fill="#ffffff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">

    <!-- ======================== 标题 ======================== -->
    <text x="24" y="32" font-size="15" font-weight="700" fill="#0f172a">阶段讲解与放行机制</text>
    <line x1="24" y1="40" x2="204" y2="40" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- ======================== 阶段循环大回环 (最先画, 置于底层) ======================== -->
    <g stroke="#94a3b8" stroke-width="1.6" fill="none" stroke-dasharray="6 4" marker-end="url(#arr)">
      <path d="M570,818 L910,818 L910,70 L562,70"/>
    </g>
    <text x="924" y="444" text-anchor="middle" font-size="9" fill="#64748b" font-weight="600"
          transform="rotate(90,924,444)">下一阶段循环</text>

    <!-- ======================== Phase 1 标识 ======================== -->
    <circle cx="35" cy="70" r="14" fill="#0065fd"/>
    <text x="35" y="70" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="58" y="67" font-size="13" font-weight="700" fill="#1e40af" dominant-baseline="middle">讲解执行</text>
    <text x="58" y="83" font-size="10" fill="#3b82f6" dominant-baseline="middle">选择讲解模式并完成本阶段内容</text>

    <!-- ======================== N1 阶段讲解 ======================== -->
    <g filter="url(#shadow)">
      <rect x="400" y="48" width="160" height="44" rx="22" fill="#0065fd"/>
    </g>
    <text x="480" y="70" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#ffffff">阶段讲解</text>

    <!-- N1 → D1 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="480" y1="92" x2="480" y2="115"/>
    </g>

    <!-- D1 选择讲解模式 -->
    <polygon points="418,150 480,117 542,150 480,183" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="480" y="144" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e293b" font-weight="600">选择讲解模式</text>
    <text x="480" y="160" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#ca8a04" font-weight="600">step / all</text>

    <!-- D1 → step (左) -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <path d="M418,150 L240,150 L240,191"/>
    </g>
    <!-- D1 → all (右) -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <path d="M542,150 L720,150 L720,191"/>
    </g>
    <g font-size="9" font-weight="600">
      <rect x="312" y="138" width="34" height="14" rx="2" fill="#eff6ff"/>
      <text x="329" y="146" text-anchor="middle" dominant-baseline="middle" fill="#0065fd">step</text>
      <rect x="614" y="138" width="26" height="14" rx="2" fill="#eff6ff"/>
      <text x="627" y="146" text-anchor="middle" dominant-baseline="middle" fill="#0065fd">all</text>
    </g>

    <!-- B1 step 分步讲解 -->
    <g filter="url(#shadow)">
      <rect x="170" y="192" width="140" height="44" rx="10" fill="#ffffff" stroke="#0065fd" stroke-width="2"/>
    </g>
    <text x="240" y="208" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#1e293b">step 分步讲解</text>
    <text x="240" y="223" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#64748b">讲一个 → 确认 → 下一个</text>

    <!-- B2 all 全部讲解 -->
    <g filter="url(#shadow)">
      <rect x="650" y="192" width="140" height="44" rx="10" fill="#ffffff" stroke="#0065fd" stroke-width="2"/>
    </g>
    <text x="720" y="208" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#1e293b">all 全部讲解</text>
    <text x="720" y="223" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#64748b">一次性讲完本阶段</text>

    <!-- ======================== step 子知识点 ======================== -->
    <rect x="180" y="258" width="120" height="24" rx="6" fill="#ffffff" stroke="#0065fd" stroke-width="1.5"/>
    <text x="240" y="270" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1e293b">讲解子知识点 1</text>

    <rect x="180" y="296" width="120" height="24" rx="6" fill="#ffffff" stroke="#0065fd" stroke-width="1.5"/>
    <text x="240" y="308" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1e293b">讲解子知识点 2</text>

    <rect x="180" y="366" width="120" height="24" rx="6" fill="#ffffff" stroke="#0065fd" stroke-width="1.5"/>
    <text x="240" y="378" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1e293b">讲解子知识点 N</text>

    <!-- step 子知识点连线 -->
    <g stroke="#94a3b8" stroke-width="1.5" fill="none" marker-end="url(#arr)">
      <line x1="240" y1="236" x2="240" y2="256"/>
      <line x1="240" y1="282" x2="240" y2="294"/>
    </g>
    <g stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-dasharray="3 3" marker-end="url(#arr)">
      <line x1="240" y1="320" x2="240" y2="364"/>
    </g>
    <rect x="222" y="336" width="36" height="14" rx="4" fill="#ffffff"/>
    <text x="240" y="343" text-anchor="middle" dominant-baseline="middle" font-size="13" fill="#94a3b8">···</text>

    <!-- ======================== all 路径中间卡片 ======================== -->
    <g filter="url(#shadow)">
      <rect x="640" y="310" width="160" height="36" rx="8" fill="#ffffff" stroke="#0065fd" stroke-width="1.5"/>
    </g>
    <text x="720" y="322" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1e293b">一次性讲完</text>
    <text x="720" y="335" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#64748b">本阶段全部子知识点</text>

    <!-- B2 → all 卡片 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="720" y1="236" x2="720" y2="308"/>
    </g>

    <!-- ======================== 汇合 → 完成阶段讲解 ======================== -->
    <!-- step: subN 底(240,390) → 下 → (240,406) → 右 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none">
      <path d="M240,390 L240,406 L478,406"/>
    </g>
    <!-- all: all卡片底(720,346) → 下 → (720,406) → 左 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none">
      <path d="M720,346 L720,406 L482,406"/>
    </g>
    <!-- 汇合 → 下 → 完成阶段讲解 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="480" y1="406" x2="480" y2="430"/>
    </g>

    <!-- 完成阶段讲解 -->
    <g filter="url(#shadow)">
      <rect x="400" y="432" width="160" height="44" rx="12" fill="#e5e9ff" stroke="#0065fd" stroke-width="2"/>
    </g>
    <text x="480" y="454" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#1e293b">完成阶段讲解</text>

    <!-- 完成阶段讲解 → D2 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="480" y1="476" x2="480" y2="496"/>
    </g>

    <!-- ======================== Phase 2 标识 ======================== -->
    <circle cx="35" cy="520" r="14" fill="#22c55e"/>
    <text x="35" y="520" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="58" y="517" font-size="13" font-weight="700" fill="#166534" dominant-baseline="middle">放行验证</text>
    <text x="58" y="533" font-size="10" fill="#22c55e" dominant-baseline="middle">判断是否放行进入下一阶段</text>

    <!-- D2 自检开启？ -->
    <polygon points="418,525 480,497 542,525 480,553" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="480" y="521" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e293b" font-weight="600">自检开启？</text>
    <text x="480" y="537" text-anchor="middle" dominant-baseline="middle" font-size="7.5" fill="#ca8a04">持久化设置</text>

    <!-- D2 → 否(口头确认) 左 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <path d="M418,525 L240,525 L240,566"/>
    </g>
    <!-- D2 → 是(出自检题) 右 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <path d="M542,525 L720,525 L720,566"/>
    </g>
    <g font-size="9" font-weight="600">
      <rect x="314" y="513" width="22" height="14" rx="2" fill="#fef3c7"/>
      <text x="325" y="521" text-anchor="middle" dominant-baseline="middle" fill="#b45309">否</text>
      <rect x="624" y="513" width="22" height="14" rx="2" fill="#dcfce7"/>
      <text x="635" y="521" text-anchor="middle" dominant-baseline="middle" fill="#16a34a">是</text>
    </g>

    <!-- C1 口头确认 -->
    <g filter="url(#shadow)">
      <rect x="170" y="567" width="140" height="44" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    </g>
    <text x="240" y="583" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#1e293b">口头确认</text>
    <text x="240" y="598" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#64748b">"理解了吗？有疑问吗？"</text>

    <!-- C2 出自检题 -->
    <g filter="url(#shadow)">
      <rect x="650" y="567" width="140" height="44" rx="10" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
    </g>
    <text x="720" y="583" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#1e293b">出自检题</text>
    <text x="720" y="598" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#64748b">1-3 道原理题</text>

    <!-- C1 → D3 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="240" y1="611" x2="240" y2="631"/>
    </g>
    <!-- C2 → D4 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="720" y1="611" x2="720" y2="631"/>
    </g>

    <!-- D3 理解了吗？ -->
    <polygon points="188,660 240,632 292,660 240,688" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="240" y="660" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1e293b" font-weight="600">理解了吗？</text>

    <!-- D4 全部答错？ -->
    <polygon points="668,660 720,632 772,660 720,688" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="720" y="654" text-anchor="middle" dominant-baseline="middle" font-size="10" fill="#1e293b" font-weight="600">全部答错？</text>
    <text x="720" y="668" text-anchor="middle" dominant-baseline="middle" font-size="7.5" fill="#ca8a04">无一道通过</text>

    <!-- ===== D3 懂了 (向下 → 汇合) ===== -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none">
      <line x1="240" y1="688" x2="240" y2="770"/>
    </g>
    <rect x="250" y="700" width="30" height="14" rx="2" fill="#dcfce7"/>
    <text x="265" y="708" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#16a34a" font-weight="600">懂了</text>

    <!-- ===== D3 有疑问 (左回环 → C1) ===== -->
    <g stroke="#f59e0b" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr-o)">
      <path d="M188,660 L110,660 L110,589 L168,589"/>
    </g>
    <rect x="128" y="646" width="44" height="14" rx="2" fill="#fef3c7"/>
    <text x="150" y="654" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#b45309" font-weight="600">有疑问</text>
    <text x="98" y="624" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#b45309" font-weight="600"
          transform="rotate(-90,98,624)">解答后确认</text>

    <!-- ===== D4 是(全错) (向下 → D5) ===== -->
    <g stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arr-r)">
      <line x1="720" y1="688" x2="720" y2="702"/>
    </g>
    <rect x="730" y="688" width="48" height="14" rx="2" fill="#fee2e2"/>
    <text x="754" y="696" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#dc2626" font-weight="600">是(全错)</text>

    <!-- ===== D4 否(答对) (左 → 汇合) ===== -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none">
      <path d="M668,660 L590,660 L590,770"/>
    </g>
    <rect x="600" y="646" width="52" height="14" rx="2" fill="#dcfce7"/>
    <text x="626" y="654" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#16a34a" font-weight="600">否(答对)</text>

    <!-- D5 需要重讲？ -->
    <polygon points="668,730 720,703 772,730 720,757" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="720" y="724" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1e293b" font-weight="600">需要</text>
    <text x="720" y="738" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#1e293b" font-weight="600">重讲？</text>

    <!-- ===== D5 不需要 (向下 → 汇合) ===== -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none">
      <line x1="720" y1="757" x2="720" y2="770"/>
    </g>
    <rect x="730" y="758" width="44" height="14" rx="2" fill="#dcfce7"/>
    <text x="752" y="766" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#16a34a" font-weight="600">不需要</text>

    <!-- ===== D5 需要 (右回环 → C2) ===== -->
    <g stroke="#f59e0b" stroke-width="1.6" fill="none" stroke-dasharray="5 3" marker-end="url(#arr-o)">
      <path d="M772,730 L850,730 L850,589 L792,589"/>
    </g>
    <rect x="794" y="716" width="36" height="14" rx="2" fill="#fef3c7"/>
    <text x="812" y="724" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#b45309" font-weight="600">需要</text>
    <text x="862" y="660" text-anchor="middle" dominant-baseline="middle" font-size="8.5" fill="#b45309" font-weight="600"
          transform="rotate(90,862,660)">重讲后出题</text>

    <!-- ======================== 汇合线 (y=770) ======================== -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none">
      <line x1="240" y1="770" x2="720" y2="770"/>
    </g>
    <!-- 汇合 → 下 → 进入下一阶段 -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#arr-g)">
      <line x1="480" y1="770" x2="480" y2="794"/>
    </g>

    <!-- 进入下一阶段 -->
    <g filter="url(#shadow)">
      <rect x="390" y="796" width="180" height="44" rx="22" fill="#22c55e"/>
    </g>
    <text x="480" y="818" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#ffffff">进入下一阶段</text>

    <!-- ======================== 图例 ======================== -->
    <g transform="translate(24, 868)" font-size="9" fill="#7f8d9f">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
      <text x="30" y="4">执行路径</text>
      <line x1="96" y1="0" x2="122" y2="0" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arr-g)"/>
      <text x="128" y="4">放行通过</text>
      <line x1="196" y1="0" x2="222" y2="0" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr-r)"/>
      <text x="228" y="4">答错路径</text>
      <line x1="296" y1="0" x2="322" y2="0" stroke="#f59e0b" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#arr-o)"/>
      <text x="328" y="4">重试回路</text>
      <line x1="396" y1="0" x2="422" y2="0" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arr)"/>
      <text x="428" y="4">阶段循环</text>
      <text x="500" y="4" fill="#94a3b8">用户可随时：跳过自检 · 关闭自检 · 跳过阶段 · 复习 · 切换输出模式</text>
    </g>

  </g>
</svg>
