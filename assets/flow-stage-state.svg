<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#ca8a04"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1000" height="340" fill="#ffffff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">

    <!-- 图标题 -->
    <text x="24" y="28" font-size="15" font-weight="700" fill="#0f172a">阶段状态机</text>
    <line x1="24" y1="36" x2="128" y2="36" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="24" y="52" font-size="10" fill="#94a3b8">not_started → in_progress → completed · 讲完即 completed · 复习不改变状态</text>

    <!-- ============================================================ -->
    <!-- 节点                                                           -->
    <!-- ============================================================ -->

    <!-- NS not_started [130,132,180,56] center=(220,160) bottom=188 top=132 right=310 -->
    <g filter="url(#shadow)">
      <rect x="130" y="132" width="180" height="56" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <text x="220" y="153" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1e293b">not_started</text>
    <text x="220" y="172" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748b">未开始讲解</text>

    <!-- IP in_progress [410,132,180,56] center=(500,160) bottom=188 top=132 left=410 right=590 -->
    <g filter="url(#shadow)">
      <rect x="410" y="132" width="180" height="56" rx="12" fill="#e5e9ff" stroke="#0065fd" stroke-width="2"/>
    </g>
    <text x="500" y="153" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1e293b">in_progress</text>
    <text x="500" y="172" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748b">讲解中（用于中途存档）</text>

    <!-- CP completed [690,132,180,56] center=(780,160) bottom=188 top=132 left=690 right=870 -->
    <g filter="url(#shadow)">
      <rect x="690" y="132" width="180" height="56" rx="12" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    </g>
    <text x="780" y="153" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="600" fill="#1e293b">completed</text>
    <text x="780" y="172" text-anchor="middle" dominant-baseline="middle" font-size="9.5" fill="#64748b">已讲完（内容保存在正文）</text>

    <!-- ============================================================ -->
    <!-- 连线 (画在节点之上，确保箭头可见)                                -->
    <!-- ============================================================ -->

    <!-- 1. NS → IP (开始讲解, 灰色, 水平) NS右=310 → IP左前2px=408 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="310" y1="160" x2="408" y2="160"/>
    </g>

    <!-- 2. IP → CP (讲完, 绿色, 水平) IP右=590 → CP左前2px=688 -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#arr-g)">
      <line x1="590" y1="160" x2="688" y2="160"/>
    </g>

    <!-- 3. NS → CP (用户跳过, 灰色虚线, 顶部弧线)
         NS顶(220,132) → 上到y=82 → 右到x=780 → 下到CP顶前2px=130 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" stroke-dasharray="6 3" marker-end="url(#arr)">
      <path d="M220,132 L220,82 L780,82 L780,130"/>
    </g>

    <!-- 4. CP → CP (复习, 黄色虚线, 自环)
         从CP底部(760,190)向下弧形回到CP底部(800,190), 箭头朝上
         CP底=188, 起点2px外=190, 终点2px外=190 -->
    <g stroke="#ca8a04" stroke-width="1.8" fill="none" stroke-dasharray="6 3" marker-end="url(#arr-y)">
      <path d="M760,190 C760,250 800,250 800,190"/>
    </g>

    <!-- ============================================================ -->
    <!-- 标签                                                           -->
    <!-- ============================================================ -->

    <!-- "开始讲解" (NS→IP 水平段上方, 白底遮挡) -->
    <rect x="333" y="146" width="52" height="16" rx="3" fill="#ffffff"/>
    <text x="359" y="154" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="#475569">开始讲解</text>

    <!-- "讲完" (IP→CP 水平段上方, 白底遮挡) -->
    <rect x="619" y="146" width="36" height="16" rx="3" fill="#ffffff"/>
    <text x="637" y="154" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="#16a34a">讲完</text>

    <!-- "用户跳过" (顶部弧线水平段上方, 白底遮挡) -->
    <rect x="466" y="68" width="68" height="16" rx="3" fill="#ffffff"/>
    <text x="500" y="76" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="#64748b">用户跳过</text>

    <!-- "复习（状态不变）" (自环下方, 白底遮挡) -->
    <rect x="724" y="248" width="112" height="16" rx="3" fill="#ffffff"/>
    <text x="780" y="256" text-anchor="middle" dominant-baseline="middle" font-size="10" font-weight="600" fill="#a16207">复习（状态不变）</text>

    <!-- ============================================================ -->
    <!-- 图例                                                           -->
    <!-- ============================================================ -->
    <g transform="translate(24, 318)" font-size="9" fill="#7f8d9f">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
      <text x="30" y="4">执行路径</text>
      <line x1="96" y1="0" x2="122" y2="0" stroke="#22c55e" stroke-width="1.8" marker-end="url(#arr-g)"/>
      <text x="128" y="4">完成路径</text>
      <line x1="196" y1="0" x2="222" y2="0" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr)"/>
      <text x="228" y="4">跳过路径</text>
      <line x1="296" y1="0" x2="322" y2="0" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-y)"/>
      <text x="328" y="4">复习路径</text>
      <rect x="396" y="-7" width="13" height="13" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="414" y="4">未开始</text>
      <rect x="466" y="-7" width="13" height="13" rx="3" fill="#e5e9ff" stroke="#0065fd" stroke-width="1.5"/>
      <text x="484" y="4">进行中</text>
      <rect x="536" y="-7" width="13" height="13" rx="3" fill="#dcfce7" stroke="#22c55e" stroke-width="1.5"/>
      <text x="554" y="4">已完成</text>
    </g>

  </g>
</svg>
