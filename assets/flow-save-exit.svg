<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#94a3b8"/>
    </marker>
    <marker id="arr-g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#22c55e"/>
    </marker>
    <marker id="arr-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#ef4444"/>
    </marker>
    <marker id="arr-y" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,1 L9,5 L0,9 z" fill="#ca8a04"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="116%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>

  <rect width="1100" height="520" fill="#ffffff"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">

    <!-- 图标题 -->
    <text x="24" y="32" font-size="15" font-weight="700" fill="#0f172a">主动存档与退出处理</text>
    <line x1="24" y1="40" x2="204" y2="40" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- ============================================================ -->
    <!-- Phase 1 标识 (左侧)                                            -->
    <!-- ============================================================ -->
    <circle cx="35" cy="86" r="14" fill="#0065fd"/>
    <text x="35" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
    <text x="58" y="83" font-size="13" font-weight="700" fill="#1e40af" dominant-baseline="middle">退出流程</text>
    <text x="58" y="99" font-size="10" fill="#3b82f6" dominant-baseline="middle">判断退出时是否保存进度</text>

    <!-- ============================================================ -->
    <!-- Phase 2 标识 (右侧)                                            -->
    <!-- ============================================================ -->
    <circle cx="575" cy="86" r="14" fill="#22c55e"/>
    <text x="575" y="90" text-anchor="middle" dominant-baseline="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
    <text x="598" y="83" font-size="13" font-weight="700" fill="#166534" dominant-baseline="middle">主动存档</text>
    <text x="598" y="99" font-size="10" fill="#22c55e" dominant-baseline="middle">用户主动保存当前进度</text>

    <!-- ============================================================ -->
    <!-- Phase 1 节点 (退出流程)                                        -->
    <!-- ============================================================ -->

    <!-- N1 用户说退出/结束 (蓝色胶囊) [190,76,180,48] center=(280,100) bottom=124 -->
    <g filter="url(#shadow)">
      <rect x="190" y="76" width="180" height="48" rx="24" fill="#0065fd"/>
    </g>
    <text x="280" y="94" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#ffffff">用户说"退出 / 结束"</text>
    <text x="280" y="112" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#bfdbfe">触发退出流程</text>

    <!-- D1 有未保存进度？ (菱形) center=(280,176) top=144 bottom=208 left=218 right=342 -->
    <polygon points="218,176 280,144 342,176 280,208" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
    <text x="280" y="170" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e293b" font-weight="600">有未保存</text>
    <text x="280" y="186" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1e293b" font-weight="600">进度？</text>

    <!-- A1 提示是否保存 (黄色虚线) [375,152,130,48] center=(440,176) bottom=200 -->
    <rect x="375" y="152" width="130" height="48" rx="10" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="5 3"/>
    <text x="440" y="170" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#92400e" font-weight="600">提示：是否保存</text>
    <text x="440" y="186" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#92400e" font-weight="600">当前进度？</text>
    <text x="440" y="196" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#ca8a04">虚线 = 询问用户</text>

    <!-- E1 直接退出 (灰色) [32,298,96,44] center=(80,320) top=298 -->
    <g filter="url(#shadow)">
      <rect x="32" y="298" width="96" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <text x="80" y="315" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#475569">直接退出</text>
    <text x="80" y="331" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#94a3b8">不保存</text>

    <!-- E2 存档+退出 (绿色) [152,298,96,44] center=(200,320) top=298 -->
    <g filter="url(#shadow)">
      <rect x="152" y="298" width="96" height="44" rx="22" fill="#22c55e"/>
    </g>
    <text x="200" y="315" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#ffffff">存档 + 退出</text>
    <text x="200" y="331" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#bbf7d0">执行存档</text>

    <!-- E3 不保存退出 (红色) [272,298,96,44] center=(320,320) top=298 -->
    <g filter="url(#shadow)">
      <rect x="272" y="298" width="96" height="44" rx="22" fill="#ef4444"/>
    </g>
    <text x="320" y="315" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#ffffff">不保存退出</text>
    <text x="320" y="331" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#fecaca">丢弃进度</text>

    <!-- E4 取消 (灰色) [392,298,96,44] center=(440,320) top=298 -->
    <g filter="url(#shadow)">
      <rect x="392" y="298" width="96" height="44" rx="22" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
    </g>
    <text x="440" y="315" text-anchor="middle" dominant-baseline="middle" font-size="11" font-weight="600" fill="#475569">取消</text>
    <text x="440" y="331" text-anchor="middle" dominant-baseline="middle" font-size="8" fill="#94a3b8">继续学习</text>

    <!-- ============================================================ -->
    <!-- Phase 2 节点 (主动存档)                                        -->
    <!-- ============================================================ -->

    <!-- N2 用户说保存进度 (蓝色胶囊) [690,76,180,48] center=(780,100) bottom=124 -->
    <g filter="url(#shadow)">
      <rect x="690" y="76" width="180" height="48" rx="24" fill="#0065fd"/>
    </g>
    <text x="780" y="94" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#ffffff">用户说"保存进度"</text>
    <text x="780" y="112" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#bfdbfe">/ 存档 / 存一下</text>

    <!-- P1 写入 save.md (蓝色矩形) [690,176,180,52] center=(780,202) bottom=228 -->
    <g filter="url(#shadow)">
      <rect x="690" y="176" width="180" height="52" rx="12" fill="#e5e9ff" stroke="#0065fd" stroke-width="2"/>
    </g>
    <text x="780" y="196" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#1e293b">写入 save.md</text>
    <text x="780" y="214" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#0065fd">阶段 · 子知识点 · 对话摘要</text>

    <!-- E5 回复确认 (绿色胶囊) [700,296,160,50] center=(780,321) top=296 bottom=346 -->
    <g filter="url(#shadow)">
      <rect x="700" y="296" width="160" height="50" rx="25" fill="#22c55e"/>
    </g>
    <text x="780" y="315" text-anchor="middle" dominant-baseline="middle" font-size="12" font-weight="600" fill="#ffffff">回复确认</text>
    <text x="780" y="333" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="#bbf7d0">"已保存当前进度"</text>

    <!-- 附注卡片 (右下角，说明存档触发) -->
    <rect x="600" y="400" width="360" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="614" y="417" font-size="9" fill="#64748b" dominant-baseline="middle">
      <tspan font-weight="600" fill="#475569">触发词：</tspan>
      <tspan>"保存进度" · "存一下" · "存档" · "记住这里"</tspan>
    </text>

    <!-- ============================================================ -->
    <!-- 中央"或"分隔装饰                                               -->
    <!-- ============================================================ -->
    <line x1="540" y1="68" x2="540" y2="360" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4 4"/>
    <circle cx="540" cy="200" r="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
    <text x="540" y="204" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#94a3b8" font-weight="600">或</text>

    <!-- ============================================================ -->
    <!-- Phase 1 连线 (画在方框之上，确保箭头可见)                        -->
    <!-- ============================================================ -->

    <!-- N1 → D1 (竖线, 124→142, D1顶=144) -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="280" y1="124" x2="280" y2="142"/>
    </g>

    <!-- D1 "否" → E1 (左→下, L型路径) D1左(218,176)→左到x=80→下到E1顶前2px(296) -->
    <g stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arr-r)">
      <path d="M218,176 L80,176 L80,296"/>
    </g>

    <!-- D1 "是" → A1 (右, 短水平线) D1右(342,176)→A1左前2px(373) -->
    <g stroke="#ca8a04" stroke-width="1.8" fill="none" stroke-dasharray="5 3" marker-end="url(#arr-y)">
      <line x1="342" y1="176" x2="373" y2="176"/>
    </g>

    <!-- A1 → 分流干线 (灰色无箭头) A1底(440,200)→下到y=246, 水平到x=200 -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none">
      <line x1="440" y1="200" x2="440" y2="246"/>
      <line x1="200" y1="246" x2="440" y2="246"/>
    </g>

    <!-- A1 → E2 保存 (绿色, 竖线下到E2顶前2px=294) -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#arr-g)">
      <line x1="200" y1="246" x2="200" y2="294"/>
    </g>

    <!-- A1 → E3 不保存 (红色, 竖线下到E3顶前2px=294) -->
    <g stroke="#ef4444" stroke-width="1.8" fill="none" marker-end="url(#arr-r)">
      <line x1="320" y1="246" x2="320" y2="294"/>
    </g>

    <!-- A1 → E4 取消 (灰色, 竖线下到E4顶前2px=294) -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="440" y1="246" x2="440" y2="294"/>
    </g>

    <!-- ============================================================ -->
    <!-- Phase 1 标签 (白底遮挡线，确保不覆盖箭头)                        -->
    <!-- ============================================================ -->

    <!-- "否" 标签 (D1→E1 水平段上方) -->
    <rect x="140" y="162" width="20" height="12" rx="2" fill="#ffffff"/>
    <text x="150" y="168" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="600" fill="#dc2626">否</text>

    <!-- "是" 标签 (D1→A1 水平段上方) -->
    <rect x="348" y="162" width="20" height="12" rx="2" fill="#ffffff"/>
    <text x="358" y="168" text-anchor="middle" dominant-baseline="middle" font-size="9" font-weight="600" fill="#ca8a04">是</text>

    <!-- "保存" 标签 (E2 竖线上, 白底遮挡) -->
    <rect x="186" y="262" width="28" height="12" rx="2" fill="#ffffff"/>
    <text x="200" y="268" text-anchor="middle" dominant-baseline="middle" font-size="8.5" font-weight="600" fill="#16a34a">保存</text>

    <!-- "不保存" 标签 (E3 竖线上, 白底遮挡) -->
    <rect x="300" y="262" width="40" height="12" rx="2" fill="#ffffff"/>
    <text x="320" y="268" text-anchor="middle" dominant-baseline="middle" font-size="8.5" font-weight="600" fill="#dc2626">不保存</text>

    <!-- "取消" 标签 (E4 竖线上, 白底遮挡) -->
    <rect x="428" y="262" width="24" height="12" rx="2" fill="#ffffff"/>
    <text x="440" y="268" text-anchor="middle" dominant-baseline="middle" font-size="8.5" font-weight="600" fill="#64748b">取消</text>

    <!-- ============================================================ -->
    <!-- Phase 2 连线                                                  -->
    <!-- ============================================================ -->

    <!-- N2 → P1 (竖线, 124→174, P1顶=176) -->
    <g stroke="#94a3b8" stroke-width="1.8" fill="none" marker-end="url(#arr)">
      <line x1="780" y1="124" x2="780" y2="174"/>
    </g>

    <!-- P1 → E5 (竖线, 228→294, E5顶=296) -->
    <g stroke="#22c55e" stroke-width="1.8" fill="none" marker-end="url(#arr-g)">
      <line x1="780" y1="228" x2="780" y2="294"/>
    </g>

    <!-- ============================================================ -->
    <!-- 图例                                                           -->
    <!-- ============================================================ -->
    <g transform="translate(24, 490)" font-size="9" fill="#7f8d9f">
      <line x1="0" y1="0" x2="24" y2="0" stroke="#94a3b8" stroke-width="1.8" marker-end="url(#arr)"/>
      <text x="30" y="4">执行路径</text>
      <line x1="96" y1="0" x2="122" y2="0" stroke="#ca8a04" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#arr-y)"/>
      <text x="128" y="4">询问路径</text>
      <rect x="196" y="-7" width="13" height="13" rx="6.5" fill="#0065fd"/>
      <text x="214" y="4">用户触发</text>
      <rect x="276" y="-7" width="13" height="13" rx="3" fill="#e5e9ff" stroke="#0065fd" stroke-width="1.5"/>
      <text x="294" y="4">执行动作</text>
      <polygon points="364,-6 374,0 364,6 354,0" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
      <text x="380" y="4">判断/决策</text>
      <rect x="432" y="-7" width="13" height="13" rx="3" fill="#fffbeb" stroke="#ca8a04" stroke-width="1.5" stroke-dasharray="3 2"/>
      <text x="450" y="4">询问节点</text>
      <rect x="510" y="-7" width="13" height="13" rx="6.5" fill="#22c55e"/>
      <text x="528" y="4">成功终点</text>
      <rect x="588" y="-7" width="13" height="13" rx="6.5" fill="#ef4444"/>
      <text x="606" y="4">终止终点</text>
      <rect x="666" y="-7" width="13" height="13" rx="6.5" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
      <text x="684" y="4">回退/取消</text>
    </g>

  </g>
</svg>
